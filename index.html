<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12332F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nasaq">
<meta name="author" content="Roaa Walid Alkhawaldeh">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="description" content="Nasaq — digital products by Roaa Walid Alkhawaldeh, Software Engineering student.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>نَسَق — منتجات رقمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface2:#E6ECE9; --ink:#14282A; --muted:#566A68; --line:#D3DCD8;
  --brand:#173F3A; --brand-ink:#F1F4F2; --gold:#A9853F; --gold-soft:#EADFC6; --wa:#178A4A;
  --shadow:0 14px 30px -16px rgba(20,40,42,.35);
  --display:"El Messiri","Noto Naskh Arabic","Segoe UI",Tahoma,serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1918; --surface:#122624; --surface2:#1A3331; --ink:#E8EFEC; --muted:#94AAA6; --line:#25433F;
    --brand:#CDAE72; --brand-ink:#10231F; --gold:#CDAE72; --gold-soft:#2A3B33; --wa:#1F9A55;
    --shadow:0 14px 30px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1918; --surface:#122624; --surface2:#1A3331; --ink:#E8EFEC; --muted:#94AAA6; --line:#25433F;
  --brand:#CDAE72; --brand-ink:#10231F; --gold:#CDAE72; --gold-soft:#2A3B33; --wa:#1F9A55;
  --shadow:0 14px 30px -16px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent}
html[lang="en"] body{line-height:1.6}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{line-height:1.2;letter-spacing:-.005em}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.i{width:1.3em;height:1.3em;flex:none}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:18px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:12px;background:#12332F;color:#D9BE85;display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:700;line-height:1;padding-bottom:4px;box-shadow:inset 0 0 0 1.5px rgba(217,190,133,.55)}
.bn{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;display:flex;flex-direction:column}
.bn small{font-family:var(--body);font-size:11.5px;font-weight:400;color:var(--muted)}
.dnav{display:none;gap:4px}
.dnav button{padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.dnav button[aria-current="page"]{background:var(--surface2);color:var(--ink)}
.tools{display:flex;gap:6px;align-items:center}
.ib{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.ib.lang{width:auto;padding:0 14px;border-radius:999px;font-weight:600;font-size:14.5px}
.count{position:absolute;top:-4px;inset-inline-start:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-size:12px;font-weight:600;display:grid;place-items:center;line-height:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15.5px;transition:transform .15s,opacity .15s;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.gold{background:#D9BE85;color:#12332F}
.btn.line-light{border:1.5px solid rgba(238,243,240,.45);color:#EEF3F0}
.btn.block{width:100%}

/* hero */
.hero{position:relative;overflow:hidden;color:#EEF3F0;background:radial-gradient(120% 90% at 100% 0%,#24534C 0%,#12332F 55%,#0D2724 100%);border-radius:0 0 34px 34px;padding:34px 0 44px}
.hero-arcs{position:absolute;inset-inline-end:-120px;bottom:-140px;width:420px;height:420px;opacity:.5;pointer-events:none}
.hero-in{position:relative;display:grid;gap:8px}
.hero h1{font-size:clamp(30px,7.2vw,54px);line-height:1.25;max-width:14em}
html[lang="en"] .hero h1{line-height:1.12;max-width:13em}
.hero p.sub{margin-top:14px;color:#C9D6D2;max-width:30em;font-size:17px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.fan{position:relative;height:300px;margin-top:30px}
.fan .cv{position:absolute;top:10px;left:50%;width:150px;margin-left:-75px;border-radius:14px;overflow:hidden;box-shadow:0 26px 40px -18px rgba(0,0,0,.65);transform-origin:50% 120%}
.fan .cv svg{display:block;width:100%;height:auto}
.fan .c1{transform:rotate(-11deg) translateX(-88px);animation:f1 .9s .15s cubic-bezier(.2,.8,.2,1) both}
.fan .c2{transform:translateY(-14px);z-index:2;animation:f2 .9s cubic-bezier(.2,.8,.2,1) both;width:164px;margin-left:-82px}
.fan .c3{transform:rotate(11deg) translateX(88px);animation:f3 .9s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes f1{from{transform:rotate(0) translateX(0)}}
@keyframes f3{from{transform:rotate(0) translateX(0)}}
@keyframes f2{from{transform:translateY(24px);opacity:.4}}
@media (min-width:860px){
  .hero{padding:64px 0 72px}
  .hero-in{grid-template-columns:1.1fr .9fr;align-items:center;gap:40px}
  .fan{height:380px;margin:0}
  .fan .cv{width:180px;margin-left:-90px}
  .fan .c2{width:200px;margin-left:-100px}
  .fan .c1{transform:rotate(-11deg) translateX(-118px)}
  .fan .c3{transform:rotate(11deg) translateX(118px)}
}

/* sections */
.sec{padding:36px 0 4px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-size:26px}
.sec-h .more{color:var(--gold);font-weight:600;font-size:15px;padding:6px 0}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 18px 16px;margin-inline:-18px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 172px;scroll-snap-align:start}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.cover{position:relative;background:var(--surface2)}
.cover svg{display:block;width:100%;height:auto}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:rgba(255,255,255,.92);color:#12332F;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;line-height:1.6}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.cat{font-size:12.5px;color:var(--muted)}
.card h3{font-size:17px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.exline{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[lang="en"] .card h3{line-height:1.25;min-height:2.5em;font-size:18px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.price{font-weight:600;font-size:16px;display:flex;flex-direction:column;line-height:1.35}
.price s{font-weight:400;color:var(--muted);font-size:12.5px}
.add{width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.add:active{transform:scale(.92)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:21px;font-weight:700;color:#12332F;background:#D9BE85}
.steps h3{font-size:19px}
.steps p{color:var(--muted)}
@media (min-width:860px){.steps{grid-template-columns:repeat(3,1fr);gap:28px}.steps li{grid-template-columns:1fr;border:0;padding:0}}

/* install */
.install{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.install h3{font-size:21px}
.install p{color:var(--muted);margin-top:2px}

/* shop */
.page-h{padding:28px 0 8px}
.page-h h1{font-size:32px}
.page-h p{color:var(--muted);margin-top:4px}
.search{position:relative;margin:14px 0 12px}
.search input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding-inline:46px 16px}
.search .i{position:absolute;top:50%;inset-inline-start:15px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 14px;margin-inline:-18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.empty{text-align:center;padding:44px 12px;color:var(--muted);display:grid;gap:14px;justify-items:center}
.empty h3{color:var(--ink);font-size:21px}

/* contact */
.contact-hero{background:#12332F;color:#EEF3F0;border-radius:24px;padding:26px 22px;margin-top:8px}
.contact-hero h2{font-size:26px}
.contact-hero p{color:#C9D6D2;margin-top:6px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:600;letter-spacing:.5px;font-size:22px;color:#D9BE85;margin-top:10px}
.contact-hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.two{display:grid;gap:18px;margin-top:18px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.box h3{font-size:21px;margin-bottom:12px}
label{display:block;font-weight:500;margin:12px 0 6px;font-size:15px}
.fld{width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:12px 14px;min-height:48px}
textarea.fld{min-height:110px;resize:vertical}
.hint{font-size:13.5px;color:var(--muted);margin-top:10px}
details{border-bottom:1px solid var(--line);padding:4px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;line-height:1;color:var(--gold)}
details[open] summary::after{content:"–"}
details p{color:var(--muted);padding-bottom:14px}

/* footer */
.foot{margin-top:44px;padding:26px 0 8px;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.foot b{font-family:var(--display);color:var(--ink);font-size:18px}
.foot .ltr{direction:ltr;unicode-bidi:isolate}
main{padding-bottom:120px}
@media (min-width:900px){main{padding-bottom:56px}}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
@supports (background:color-mix(in srgb,red 50%,blue)){.tabs{background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--muted);font-size:12.5px;font-weight:500;border-radius:12px}
.tab .i{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--gold)}
.tab .count{top:0;inset-inline-start:50%;margin-inline-start:6px}
@media (min-width:900px){.tabs{display:none}.dnav{display:flex}}

/* fab */
.fab{position:fixed;inset-inline-end:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--wa);color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px -8px rgba(0,0,0,.5)}
.fab .i{width:28px;height:28px}
@media (min-width:900px){.fab{bottom:24px;inset-inline-end:24px}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:60;background:#12332F;color:#EEF3F0;padding:10px 16px;border-radius:999px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#D9BE85;font-weight:600;padding:2px 6px}
@media (min-width:900px){.toast{bottom:32px}}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,20,18,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(28px);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.ov.on .sheet{transform:none}
.sheet.wide{max-width:780px}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;max-height:90%;padding-bottom:24px}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-head h2{font-size:24px}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.pd{display:grid;gap:18px}
@media (min-width:700px){.pd{grid-template-columns:.85fr 1.15fr;align-items:start}}
.pd-cover{border-radius:18px;overflow:hidden}
.pd-cover svg{display:block;width:100%;height:auto}
.pd-body h2{font-size:27px;margin:2px 0 6px}
.pd-body .price{flex-direction:row;align-items:baseline;gap:10px;font-size:22px;margin:6px 0 10px}
.pd-body p{color:var(--muted)}
.exline-full{background:var(--surface2);color:var(--ink);border-radius:12px;padding:9px 13px;font-size:14px;margin:8px 0 4px}
.exline-full b{color:var(--gold)}
.inc{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.inc li{display:flex;gap:10px;align-items:flex-start}
.inc .i{color:var(--gold);margin-top:5px;width:1.1em;height:1.1em}
.pd-act{display:grid;gap:10px;margin-top:8px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .th{border-radius:10px;overflow:hidden}
.line .th svg{display:block;width:100%;height:auto}
.line h3{font-size:16px;line-height:1.4}
.line .u{color:var(--muted);font-size:14px}
.qty{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:999px;padding:2px}
.qty button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.qty span{min-width:22px;text-align:center;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-size:18px}
.total b{font-family:var(--display);font-size:26px}
.install-steps{margin:8px 0 0;padding-inline-start:20px;color:var(--muted)}
.install-steps li{margin:8px 0}
.install-steps b{color:var(--ink)}

/* samples + about */
.pd-body h3{font-size:17px;margin:14px 0 2px}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.pill{display:inline-flex;gap:6px;background:var(--surface2);border-radius:999px;padding:3px 14px;font-size:13.5px}
.sm-h{font-size:21px;margin:26px 0 10px}
.samples{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}
.samples::-webkit-scrollbar{display:none}
.sm{flex:0 0 min(74vw,290px);scroll-snap-align:center;display:block;text-align:center;cursor:zoom-in}
.sm .smv{display:block;border-radius:6px;overflow:hidden;box-shadow:0 14px 26px -16px rgba(0,0,0,.6);border:1px solid var(--line)}
.sm .smv svg{display:block;width:100%;height:auto}
.sm .cap{display:block;font-size:13.5px;color:var(--muted);margin-top:8px}
@media (min-width:700px){.sm{flex-basis:calc((100% - 28px)/3)}}
.lb{position:fixed;inset:0;z-index:70;background:rgba(6,14,13,.94);display:flex;align-items:center;justify-content:center;padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .2s}
.lb.on{opacity:1;pointer-events:auto}
.lbf{margin:0;width:100%;max-width:min(92vw,520px);display:grid;gap:12px;justify-items:center;color:#EEF3F0;text-align:center}
.lbf .smv{width:100%;display:block}
.lbf svg{display:block;margin-inline:auto;width:100%;height:auto;max-height:76vh;border-radius:6px;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:14px;background:rgba(255,255,255,.16);color:#fff}
.lbn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.lbn.l{left:8px}.lbn.r{right:8px}
.about{margin-top:36px;display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:center;background:#12332F;color:#EEF3F0;border-radius:24px;padding:24px}
.av{width:72px;height:72px;border-radius:50%;background:#D9BE85;color:#12332F;display:grid;place-items:center;font-family:var(--display);font-size:38px;font-weight:700;line-height:1;padding-bottom:6px}
.about h2{font-size:23px}
.about .kick{color:#D9BE85;font-size:13px;font-weight:600;display:block}
.about .role{color:#C9D6D2;font-size:14.5px}
.about p{grid-column:1/-1;color:#C9D6D2}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

  var c=t.closest("[data-close]");if(c){closeSheet();return}
  if(t.id==="ov"){closeSheet();return}
  var i=t.closest("[data-inc]");if(i){setQty(i.getAttribute("data-inc"),1);return}
  var d=t.closest("[data-dec]");if(d){setQty(d.getAttribute("data-dec"),-1);return}
  var ch=t.closest("[data-cat]");if(ch){filter.cat=ch.getAttribute("data-cat");renderChips();renderGrid();return}
  var o=t.closest("[data-open]");if(o){openProduct(o.getAttribute("data-open"));return}
});
document.addEventListener("keydown",function(e){
  if($("#lb").classList.contains("on")){if(e.key==="Escape")closeLB();if(e.key==="ArrowRight")lbStep(lbSide("r"));if(e.key==="ArrowLeft")lbStep(lbSide("l"));return}
  if(e.key==="Escape")closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".card")){e.preventDefault();openProduct(e.target.getAttribute("data-open"))}
});
$("#cartBtn").addEventListener("click",openCart);
$("#q").addEventListener("input",function(e){filter.q=e.target.value;renderGrid()});

/* init */
applyLang();go("home");
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
